name: Godot build & release

# Builds the ready-to-run game (Windows + Linux) with Godot, smoke-tests it with the built-in
# autotest (solo + host/client over UDP) and publishes the zips as a GitHub Release.
on:
  push:
    paths:
      - 'godot/**'
      - 'Assets/Scripts/Core/**'
      - 'Assets/Scripts/Net/**'
      - 'Assets/Plugins/LiteNetLib/**'
      - '.github/workflows/godot-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1
  GODOT_TAG: 4.5.1-stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Godot (.NET) and export templates
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_mono_linux_x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$HOME/godot/Godot_v${GODOT_TAG}_mono_linux_x86_64/Godot_v${GODOT_TAG}_mono_linux.x86_64" >> $GITHUB_ENV
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_mono_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p $T
          unzip -q -o -j templates.tpz 'templates/version.txt' 'templates/linux_*.x86_64' 'templates/windows_*_x86_64*.exe' 'templates/icudt_godot.dat' -d $T
          rm templates.tpz godot.zip

      - name: Export Windows and Linux
        working-directory: godot
        run: |
          mkdir -p build/windows build/linux
          $GODOT --headless --path . --export-release "Windows Desktop" build/windows/SockGang.exe
          $GODOT --headless --path . --export-release "Linux" build/linux/SockGang.x86_64
          test -f build/windows/SockGang.exe && test -d build/windows/data_SockGang_windows_x86_64
          test -f build/linux/SockGang.x86_64

      - name: Smoke test (solo, then host + client over UDP)
        working-directory: godot/build/linux
        run: |
          timeout 300 ./SockGang.x86_64 --headless -- --autotest=solo | tee solo.log
          grep -q "ALL PASSED" solo.log
          (timeout 300 ./SockGang.x86_64 --headless -- --autotest=host --port=27791 > host.log 2>&1 &)
          sleep 3
          timeout 300 ./SockGang.x86_64 --headless -- --autotest=client --port=27791 | tee client.log
          sleep 8
          cat host.log | grep autotest
          grep -q "ALL PASSED" client.log
          grep -q "ALL PASSED" host.log
          rm -f *.log

      - name: Package
        run: |
          cd godot/build
          cp ../../docs/PLAY.txt windows/ 2>/dev/null || true
          cp ../../docs/PLAY.txt linux/ 2>/dev/null || true
          (cd windows && zip -qr ../SockGang-Windows.zip .)
          (cd linux && zip -qr ../SockGang-Linux.zip .)
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "The Sock Gang — сборка ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Готовая игра, Unity не нужен.

            **Windows:** скачайте `SockGang-Windows.zip`, распакуйте и запустите `SockGang.exe`.
            **Linux:** `SockGang-Linux.zip`, затем `./SockGang.x86_64`.

            Если Windows покажет «Windows защитила ваш компьютер», нажмите «Подробнее» → «Выполнить в любом случае»: игра не подписана сертификатом.

            Коммит: ${{ github.sha }}
          files: |
            godot/build/SockGang-Windows.zip
            godot/build/SockGang-Linux.zip
